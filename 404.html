    @font-face { font-family: "JetBrains Mono"; font-weight: 400 500; font-display: swap; src: url(/fonts/jetbrains-mono-latin.woff2) format("woff2"); }
    :root { --bg: #070B14; --line: #2A3A5C; --ink: #E8EDF6; --dim: #A3AFC4; --accent: #2563EB; --accent-hi: #7AA2FF; --accent-dark: #1D4ED8; --grid: rgba(255,255,255,.035); color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--ink); background: var(--bg);
      background-image: radial-gradient(700px 400px at 80% 0%, rgba(99,102,241,.18), transparent 70%), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);

    .code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 1rem; color: var(--accent-hi); letter-spacing: .1em; margin: 0 0 14px; }
    h1 { font-size: 2.2rem; font-weight: 600; letter-spacing: -.02em; margin: 0 0 10px; }
    p { color: var(--dim); margin: 0 0 28px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    a.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    a.btn:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 3px; }
