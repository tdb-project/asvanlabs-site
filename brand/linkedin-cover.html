<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Geist; font-weight: 400 700; src: url(../fonts/geist-latin.woff2); }
@font-face { font-family: JBM; font-weight: 400 500; src: url(../fonts/jetbrains-mono-latin.woff2); }
html,body{margin:0}
body{width:1128px;height:191px;position:relative;overflow:hidden;background:#070B14;color:#E8EDF6;font-family:Geist;
background-image:
 radial-gradient(520px 260px at 78% -20%, rgba(99,102,241,.34), transparent 70%),
 radial-gradient(420px 220px at 100% 120%, rgba(45,212,191,.16), transparent 70%),
 radial-gradient(380px 200px at 30% 130%, rgba(37,99,235,.18), transparent 70%),
 linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
 linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
background-size:auto,auto,auto,24px 24px,24px 24px}
.mark{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:210px;height:210px;opacity:.13}
.txt{position:absolute;left:330px;right:150px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
h1{margin:0;font-size:31px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
h1 .hl{background:linear-gradient(90deg,#7AA2FF,#818CF8 55%,#2DD4BF);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:JBM;font-size:13px;white-space:nowrap;letter-spacing:.04em;color:#A3AFC4;display:flex;gap:10px;align-items:center}
.sub b{color:#2DD4BF;font-weight:500}
.sub i{width:4px;height:4px;border-radius:50%;background:#2A3A5C;display:inline-block}
</style></head><body>
<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 16.5 8 24l6.5 7.5" stroke="#FFFFFF"/><path d="M33.5 16.5 40 24l-6.5 7.5" stroke="#FFFFFF"/><path d="M18.5 35 24 13l5.5 22" stroke="#FFFFFF"/><path d="M21 28h6" stroke="#2DD4BF"/></g></svg>
<div class="txt">
  <h1>Software that closes the gaps between<br><span class="hl">data, people and AI.</span></h1>
  <div class="sub"><b>asvanlabs.com</b><i></i><span>Makers of The Data-Bridge</span><i></i><span>Self-hosted · open core</span></div>
</div>
</body></html>
